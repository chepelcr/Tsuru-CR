AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stag
      - prod
    Description: Deployment environment

  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID (resolved at deploy time)

  DomainName:
    Type: String
    Default: api.tsuru.jcampos.dev
    Description: Custom domain for the API (loaded from .env API_DOMAIN)

Resources:

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/tsuru-${Environment}-api"
      RetentionInDays: 14

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn:
        Fn::ImportValue: !Sub "tsuru-${Environment}-apigateway-cloudwatch-role-arn"

  ApiGatewayRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "tsuru-${Environment}-api"
      StageName: !Ref Environment
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '$context.requestId $context.requestTime $context.httpMethod $context.resourcePath $context.status $context.responseLength $context.error.message'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Sub "tsuru-${Environment}-api"
          description: Tsuru Multi-Tenant Marketplace API
          version: '1.0.0'
        servers:
          - url: !Sub "https://${DomainName}"
            x-amazon-apigateway-endpoint-configuration:
              disableExecuteApiEndpoint: true
        components:
          securitySchemes:
            CognitoAuthorizer:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                type: cognito_user_pools
                providerARNs:
                  - Fn::ImportValue: "tsuru-cognito-UserPoolArn"
        paths:
          /api/components:
            get:
              operationId: tsuru_get
              summary: Get all components
              parameters:
                - name: type
                  in: query
                  required: false
                  schema:
                    type: string
              responses:
                '200':
                  description: OK
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                '400':
                  description: Bad Request
                '401':
                  description: Unauthorized
                '404':
                  description: Not Found
              security:
                - CognitoAuthorizer: []
              x-amazon-apigateway-integration:
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:tsuru-${Environment}-api-handler/invocations"
                passthroughBehavior: when_no_match
                contentHandling: CONVERT_TO_TEXT
                type: aws_proxy
            options:
              responses:
                '200':
                  description: CORS OK
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
                    Access-Control-Expose-Headers:
                      schema:
                        type: string
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Requested-With'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                      method.response.header.Access-Control-Expose-Headers: "'X-Page-Number,X-Page-Size,X-Total-Elements,X-Total-Pages'"
          "/api/components/{id}":
            get:
