  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          CertificateArn: !Ref ApiCertificate

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref ApiGatewayRestApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref Environment

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId

  LambdaPermissionBackend:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub "tsuru-${Environment}-api-handler"
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*"

Outputs:
  ApiId:
    Description: API Gateway ID
    Value: !Ref ApiGatewayRestApi
    Export:
      Name: !Sub "${AWS::StackName}-ApiId"

  ApiEndpoint:
    Description: Custom domain endpoint
    Value: !Sub "https://${DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  ApiInvokeUrl:
    Description: Direct invoke URL
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiInvokeUrl"