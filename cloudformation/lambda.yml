AWSTemplateFormatVersion: "2010-09-09"
Description: Tsuru Lambda Function (Simple CloudFormation - No SAM)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name — used to import shared infra policy and Cognito exports

  FunctionNameParam:
    Description: "Function Name (pattern: tsuru-{env}-api-handler)"
    Type: String
    Default: "tsuru-dev-api-handler"

Resources:
  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionNameParam
      Description: "Tsuru API Handler"
      PackageType: Zip
      Runtime: nodejs20.x
      Handler: lambda.handler
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            return {
              statusCode: 200,
              body: JSON.stringify({ message: 'Placeholder - Deploy code with update-lambda.sh' })
            };
          };
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          NODE_ENV: production
          SSM_BASE_PATH: !Sub "/tsuru/${Environment}/platform"

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "tsuru-${Environment}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - Fn::ImportValue: !Sub "tsuru-${Environment}-cognito-policy-arn"
        - Fn::ImportValue: !Sub "tsuru-${Environment}-s3-policy-arn"
        - Fn::ImportValue: !Sub "tsuru-${Environment}-ses-policy-arn"
        - Fn::ImportValue: !Sub "tsuru-${Environment}-sns-policy-arn"
        - Fn::ImportValue: !Sub "tsuru-${Environment}-sqs-policy-arn"
        - Fn::ImportValue: !Sub "tsuru-${Environment}-ssm-parameter-policy-arn"
        - Fn::ImportValue: !Sub "tsuru-${Environment}-secrets-manager-policy-arn"
        - Fn::ImportValue: !Sub "tsuru-${Environment}-decrypt-policy-arn"

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionNameParam}"
      RetentionInDays: 7

Outputs:
  LambdaFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: !Sub "tsuru-${Environment}-lambda-arn"

  LambdaFunctionName:
    Description: Lambda Function Name
    Value: !Ref LambdaFunction
    Export:
      Name: !Sub "tsuru-${Environment}-lambda-name"
