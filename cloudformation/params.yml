AWSTemplateFormatVersion: '2010-09-09'
Description: >
  JMarkets Backend Services - SSM Parameters.
  Single resource per parameter; environment encoded in the path via !Sub.
  Path prefix: /tsuru/{env}/platform  (matches server/settings.cfg ssmpath).
  DB credentials are NOT here — they live in Secrets Manager under
  tsuru/{env}/database, shared with other services.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  S3Bucket:
    Type: String
    Description: S3 bucket name for file uploads

  FromEmail:
    Type: String
    Description: SES verified sender address (e.g. noreply@tsuru.jcampos.dev)

  FrontendUrl:
    Type: String
    Description: Landing page / frontend URL (e.g. https://tsuru.jcampos.dev)

  DashboardUrl:
    Type: String
    Description: Dashboard / admin URL (e.g. https://admin.tsuru.jcampos.dev)

  CloudfrontDomain:
    Type: String
    Description: CloudFront distribution domain for cache invalidation and asset URLs

  ApiUrl:
    Type: String
    Description: Backend API URL (e.g. https://api.tsuru.jcampos.dev)

  OrdersApiUrl:
    Type: String
    Description: Orders service API URL (e.g. https://orders-api.tsuru.jcampos.dev)

  EventsApiUrl:
    Type: String
    Default: https://events.tsuru.jcampos.dev/event
    Description: >-
      AppSync Events API endpoint for real-time notifications, as browser
      clients use it. A plain parameter rather than a cross-stack import
      because the whole point of the custom domain (owned by sales-be's
      appsync-events stack) is that this value is a constant. Leave it empty to
      build the frontend without live notifications — the bell then shows what
      its one hydrate fetch loaded and stops updating until a reload.

# ---------------------------------------------------------------------------
# Resources  — one SSM parameter per entry
# ---------------------------------------------------------------------------
Resources:

  # /tsuru/{env}/platform/aws/stage
  AwsStage:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/aws/stage"
      Type: String
      Value: !Ref Environment
      Description: !Sub "Deployment stage for JMarkets Backend (${Environment})"

  # /tsuru/{env}/platform/aws/region
  AwsRegion:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/aws/region"
      Type: String
      Value: !Ref AWS::Region
      Description: AWS region

  # /tsuru/{env}/platform/aws/database
  # Points to the shared Secrets Manager secret name (same secret used by other services)
  AwsDatabase:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/aws/database"
      Type: String
      Value: !Sub "tsuru/${Environment}/database"
      Description: Shared Secrets Manager secret name for database credentials

  # /tsuru/{env}/platform/cognito/user-pool-id
  CognitoUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/cognito/user-pool-id"
      Type: String
      Value:
        Fn::ImportValue: "tsuru-cognito-UserPoolId"
      Description: Cognito User Pool ID (imported from tsuru-cognito stack)

  # /tsuru/{env}/platform/cognito/client-id
  CognitoClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/cognito/client-id"
      Type: String
      Value:
        Fn::ImportValue: "tsuru-cognito-UserPoolClientId"
      Description: Cognito User Pool Client ID (imported from tsuru-cognito stack)

  # /tsuru/{env}/platform/sns/organization-topic-arn
  SnsOrganizationTopicArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/sns/organization-topic-arn"
      Type: String
      Value:
        Fn::ImportValue: !Sub "tsuru-${Environment}-organization-events-topic-arn"
      Description: SNS topic ARN for organization events (imported from organization-publish-topic stack)

  # /tsuru/{env}/platform/s3/bucket
  S3BucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/s3/bucket"
      Type: String
      Value: !Ref S3Bucket
      Description: S3 bucket for file uploads

  # /tsuru/{env}/platform/email/from
  EmailFromParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/email/from"
      Type: String
      Value: !Ref FromEmail
      Description: SES verified sender address

  # /tsuru/{env}/platform/frontend/url
  FrontendUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/frontend/url"
      Type: String
      Value: !Ref FrontendUrl
      Description: Landing page / frontend URL

  # /tsuru/{env}/platform/dashboard/url
  DashboardUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/dashboard/url"
      Type: String
      Value: !Ref DashboardUrl
      Description: Dashboard / admin URL

  # /tsuru/{env}/platform/cloudfront/domain
  CloudfrontDomainParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/cloudfront/domain"
      Type: String
      Value: !Ref CloudfrontDomain
      Description: CloudFront distribution domain for cache invalidation and asset URLs

  # /tsuru/{env}/platform/api/url
  ApiUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/api/url"
      Type: String
      Value: !Ref ApiUrl
      Description: Backend API URL

  # /tsuru/{env}/platform/api/orders-url
  OrdersApiUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/api/orders-url"
      Type: String
      Value: !Ref OrdersApiUrl
      Description: Orders service API URL

  # /tsuru/{env}/platform/appsync/events-url
  # Read by the POS build (VITE_APPSYNC_EVENTS_URL). It lives in the `platform`
  # namespace with the rest of the frontend's config — the API URLs and the
  # Cognito ids — rather than next to the backend's publish endpoint under
  # /notifications, because this is build input for a browser bundle.
  EventsApiUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/platform/appsync/events-url"
      Type: String
      Value: !Ref EventsApiUrl
      Description: AppSync Events API endpoint for real-time notifications (browser clients)

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  SsmBasePath:
    Description: SSM base path for all JMarkets Backend parameters
    Value: !Sub "/tsuru/${Environment}/platform"
    Export:
      Name: !Sub "tsuru-${Environment}-platform-ssm-base-path"
