AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Pollos Porteños Sales — SSM Parameters.
  Path prefix: /tsuru/{env}/pollos-sales
  Shares Cognito pool with tsuru (same user base).

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  SinpeNumber:
    Type: String
    Description: SINPE Móvil destination number (e.g. 8888-8888)
    Default: "8888-8888"

  FrontendDomain:
    Type: String
    Description: Base domain for all frontend apps (e.g. tsuru.jcampos.dev)

Resources:

  # /tsuru/{env}/pollos-sales/aws/region
  AwsRegion:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/pollos-sales/aws/region"
      Type: String
      Value: !Ref AWS::Region

  # /tsuru/{env}/pollos-sales/cognito/user-pool-id  (shared with tsuru)
  CognitoUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/pollos-sales/cognito/user-pool-id"
      Type: String
      Value:
        Fn::ImportValue: "tsuru-cognito-UserPoolId"

  # /tsuru/{env}/pollos-sales/cognito/client-id  (shared with tsuru)
  CognitoClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/pollos-sales/cognito/client-id"
      Type: String
      Value:
        Fn::ImportValue: "tsuru-cognito-UserPoolClientId"

  # /tsuru/{env}/pollos-sales/api/url  (same backend)
  ApiUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/pollos-sales/api/url"
      Type: String
      Value: !Sub "https://markets-api.${FrontendDomain}"

  # /tsuru/{env}/pollos-sales/sinpe/number
  SinpeNumberParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/tsuru/${Environment}/pollos-sales/sinpe/number"
      Type: String
      Value: !Ref SinpeNumber

Outputs:
  SsmBasePath:
    Value: !Sub "/tsuru/${Environment}/pollos-sales"
    Export:
      Name: !Sub "tsuru-${Environment}-pollos-sales-ssm-base-path"
