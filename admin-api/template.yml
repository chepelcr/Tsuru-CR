AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Generated Tsuru admin API. Deploy manually from the root repository.
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - stag
    - prod
  HostedZoneId:
    Type: String
  DomainName:
    Type: String
    Default: admin-api.tsuru.jcampos.dev
Resources:
  AdminApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/tsuru-${Environment}-admin-api'
      RetentionInDays: 14
  AdminApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn:
        Fn::ImportValue: !Sub 'tsuru-${Environment}-apigateway-cloudwatch-role-arn'
  AdminApi:
    Type: AWS::Serverless::Api
    DependsOn: AdminApiGatewayAccount
    Properties:
      Name: !Sub 'tsuru-${Environment}-admin-api'
      StageName: !Ref 'Environment'
      EndpointConfiguration: REGIONAL
      DisableExecuteApiEndpoint: true
      AccessLogSetting:
        DestinationArn: !GetAtt 'AdminApiLogGroup.Arn'
        Format: $context.requestId $context.requestTime $context.httpMethod $context.resourcePath
          $context.status $context.responseLength $context.error.message
      MethodSettings:
      - ResourcePath: /*
        HttpMethod: '*'
        LoggingLevel: INFO
        DataTraceEnabled: false
        MetricsEnabled: true
      Variables:
        AdminUserPoolId:
          Fn::ImportValue: !Sub 'tsuru-${Environment}-admin-cognito-user-pool-id'
        AdminUserPoolClientId:
          Fn::ImportValue: !Sub 'tsuru-${Environment}-admin-cognito-client-id'
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: !Sub 'tsuru-${Environment}-admin-api'
          description: Dedicated Tsuru platform-administration API.
          version: 1.0.0
        servers:
        - url: !Sub 'https://${DomainName}'
        components:
          securitySchemes:
            AdminCognitoAuthorizer:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                type: cognito_user_pools
                providerARNs:
                - Fn::ImportValue: !Sub 'tsuru-${Environment}-admin-cognito-user-pool-arn'
        x-amazon-apigateway-gateway-responses:
          DEFAULT_4XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Requested-With'''
              gatewayresponse.header.Access-Control-Allow-Methods: '''GET,POST,PUT,PATCH,DELETE,OPTIONS'''
              gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
          DEFAULT_5XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Requested-With'''
              gatewayresponse.header.Access-Control-Allow-Methods: '''GET,POST,PUT,PATCH,DELETE,OPTIONS'''
              gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
          UNAUTHORIZED:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Requested-With'''
              gatewayresponse.header.Access-Control-Allow-Methods: '''GET,POST,PUT,PATCH,DELETE,OPTIONS'''
              gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
          ACCESS_DENIED:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Requested-With'''
              gatewayresponse.header.Access-Control-Allow-Methods: '''GET,POST,PUT,PATCH,DELETE,OPTIONS'''
              gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        paths:
          /api/admin/error-catalog:
            get:
              operationId: admin_platform_api_get
              summary: List the complete backend error catalog
              responses:
                '200':
                  description: OK
                '201':
                  description: Created
                '400':
                  description: Bad Request
                '401':
                  description: Unauthorized
                '403':
                  description: Forbidden
                '404':
                  description: Not Found
              security:
              - AdminCognitoAuthorizer: []
              x-amazon-apigateway-integration:
                httpMethod: POST
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:tsuru-${Environment}-api-handler/invocations'
                passthroughBehavior: when_no_match
                contentHandling: CONVERT_TO_TEXT
                type: aws_proxy
            options:
              responses:
                '200':
                  description: CORS OK
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Requested-With'''
                      method.response.header.Access-Control-Allow-Methods: '''GET,OPTIONS'''
