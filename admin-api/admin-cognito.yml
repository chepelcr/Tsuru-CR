AWSTemplateFormatVersion: "2010-09-09"
Description: Dedicated Tsuru platform-administrator Cognito user pool.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stag, prod]

Resources:
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "tsuru-${Environment}-admin"
      DeletionProtection: ACTIVE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      MfaConfiguration: ON
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: false
          Mutable: true
      UserPoolTags:
        application: tsuru-admin
        environment: !Ref Environment

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "tsuru-${Environment}-admin-dashboard"
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

Outputs:
  UserPoolId:
    Value: !Ref AdminUserPool
    Export:
      Name: !Sub "tsuru-${Environment}-admin-cognito-user-pool-id"
  UserPoolArn:
    Value: !GetAtt AdminUserPool.Arn
    Export:
      Name: !Sub "tsuru-${Environment}-admin-cognito-user-pool-arn"
  UserPoolClientId:
    Value: !Ref AdminUserPoolClient
    Export:
      Name: !Sub "tsuru-${Environment}-admin-cognito-client-id"
