<!doctype html>
<html lang="es" class="">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tsuru POS — Punto de Venta · Facturación Electrónica 4.4</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          background: 'hsl(var(--background))',
          foreground: 'hsl(var(--foreground))',
          card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
          border: 'hsl(var(--border))',
          muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
          primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
          accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
          secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
          success: { DEFAULT: 'hsl(var(--success))', foreground: 'hsl(var(--success-foreground))' },
          warning: { DEFAULT: 'hsl(var(--warning))', foreground: 'hsl(var(--warning-foreground))' },
          info: { DEFAULT: 'hsl(var(--info))', foreground: 'hsl(var(--info-foreground))' },
          destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
        },
        fontFamily: {
          sans: ['Barlow', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          display: ['"Barlow Condensed"', 'Barlow', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
      }
    }
  }
</script>

<style>
  /* ───────────────── Tokens lifted directly from
     templates/pos-system/src/index.css (POS design system) ───────────────── */
  :root {
    --brand-orange-500: 23 88% 47%;
    --brand-orange-600: 23 90% 40%;
    --background: 30 40% 98%;
    --foreground: 20 14% 16%;
    --card: 0 0% 100%;
    --card-foreground: 20 14% 16%;
    --primary: 23 88% 47%;
    --primary-foreground: 0 0% 100%;
    --secondary: 20 14% 16%;
    --secondary-foreground: 0 0% 100%;
    --muted: 30 25% 94%;
    --muted-foreground: 20 8% 45%;
    --accent: 23 100% 95%;
    --accent-foreground: 23 88% 35%;
    --destructive: 0 72% 51%;
    --destructive-foreground: 0 0% 100%;
    --success: 142 71% 40%;
    --success-foreground: 0 0% 100%;
    --warning: 38 92% 48%;
    --warning-foreground: 20 14% 12%;
    --info: 217 91% 55%;
    --info-foreground: 0 0% 100%;
    --border: 30 15% 88%;
    --input: 30 15% 88%;
    --ring: 23 88% 47%;
    --radius: 0.5rem;
  }
  .dark {
    --background: 20 14% 8%;
    --foreground: 30 20% 96%;
    --card: 20 14% 12%;
    --card-foreground: 30 20% 96%;
    --primary: 23 88% 52%;
    --primary-foreground: 0 0% 100%;
    --secondary: 30 20% 96%;
    --secondary-foreground: 20 14% 12%;
    --muted: 20 10% 18%;
    --muted-foreground: 30 10% 65%;
    --accent: 23 88% 18%;
    --accent-foreground: 23 88% 75%;
    --success: 142 71% 50%;
    --warning: 38 92% 55%;
    --info: 217 91% 65%;
    --destructive: 0 72% 55%;
    --border: 20 10% 22%;
    --input: 20 10% 22%;
    --ring: 23 88% 52%;
  }

  html, body { background: hsl(var(--background)); color: hsl(var(--foreground)); }
  body {
    font-family: Barlow, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'cv11', 'ss01';
  }
  .font-display { font-family: 'Barlow Condensed', Barlow, sans-serif !important; letter-spacing: -0.005em; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace !important; }
  .t-num { font-variant-numeric: tabular-nums; }
  .t-label { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: hsl(var(--muted-foreground)); }

  /* Smooth color transitions on accent / theme swap */
  .smooth-tokens, .smooth-tokens *:not(.no-trans) {
    transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  /* Subtle bg grid */
  .bg-grid {
    background-image:
      linear-gradient(hsl(var(--border) / 0.6) 1px, transparent 1px),
      linear-gradient(90deg, hsl(var(--border) / 0.6) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse 65% 55% at 50% 35%, #000 30%, transparent 75%);
  }

  /* Receipt scallop on cards */
  .receipt-edge {
    -webkit-mask-image: radial-gradient(circle 6px at 6px 100%, transparent 6px, #000 6.5px);
    mask-image: radial-gradient(circle 6px at 6px 100%, transparent 6px, #000 6.5px);
    -webkit-mask-size: 12px 100%;
    mask-size: 12px 100%;
  }

  /* Marquee */
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .ticker-track { animation: ticker 42s linear infinite; }

  /* Pulse dot like POS status */
  @keyframes pulse-dot { 0%, 100% { box-shadow: 0 0 0 0 hsl(var(--success) / 0.55); } 50% { box-shadow: 0 0 0 6px hsl(var(--success) / 0); } }
  .status-dot-live { width: 8px; height: 8px; border-radius: 999px; background: hsl(var(--success)); animation: pulse-dot 2s infinite; display: inline-block; }

  /* Accent palette swap (Tweaks) */
  [data-accent="orange"] { --primary: 23 88% 47%; --accent: 23 100% 95%; --accent-foreground: 23 88% 35%; --ring: 23 88% 47%; }
  [data-accent="indigo"] { --primary: 235 60% 50%; --accent: 235 100% 96%; --accent-foreground: 235 60% 38%; --ring: 235 60% 50%; }
  [data-accent="teal"]   { --primary: 174 65% 32%; --accent: 174 60% 94%;  --accent-foreground: 174 65% 24%; --ring: 174 65% 32%; }
  [data-accent="violet"] { --primary: 262 60% 48%; --accent: 262 100% 96%; --accent-foreground: 262 60% 36%; --ring: 262 60% 48%; }

  /* Reusable card */
  .card { border-radius: var(--radius); border: 1px solid hsl(var(--border)); background: hsl(var(--card)); color: hsl(var(--card-foreground)); }
  .card-hover { transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .card-hover:hover { transform: translateY(-2px); border-color: hsl(var(--primary) / 0.4); box-shadow: 0 8px 24px -12px hsl(var(--foreground) / .12); }

  html { scroll-behavior: smooth; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: hsl(var(--muted)); border-radius: 999px; border: 2px solid hsl(var(--background)); }
</style>
</head>

<body class="smooth-tokens" data-accent="orange">
<div id="root"></div>

</body>
</html>
